<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Transfer OS · 课程对比</title>
<link rel="stylesheet" href="css/app.css?v=25">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Transfer OS">
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div>
      <div class="brand">🔀 Transfer OS</div>
      <div class="sub" data-i18n="app_cmp_sub"></div>
    </div>
    <div class="langswitch">
      <button data-lang="zh" onclick="setLang('zh')">中文</button><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="es" onclick="setLang('es')">ES</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="card" id="step1">
    <div class="step-tag"><span class="step-n">1</span><span data-i18n="step1_title"></span></div>
    <label class="f" for="cc" data-i18n="f_cc"></label>
    <select id="cc"></select>

    <label class="f" for="major" data-i18n="f_major2"></label>
    <div class="sugg-wrap">
      <input id="major" type="text" value="computer science" data-i18n-ph="ph_major2" autocomplete="off"
        oninput="cmp_suggest()" onfocus="cmp_suggest()" onkeydown="cmp_suggestKey(event)" onblur="cmp_suggestHide()">
      <div class="sugg" id="majorSugg" hidden></div>
    </div>
    <div class="hint" data-i18n="f_major2_hint"></div>

    <button class="btn" id="toStep2" onclick="cmp_toStep2()" data-i18n="btn_next"></button>
    <button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="tour_start()" data-i18n="tour_replay"></button>
  </div>

  <div class="card" id="step2" hidden>
    <div class="step-tag"><span class="step-n">2</span><span data-i18n="step2_title"></span></div>
    <label class="f"><span data-i18n="f_targets"></span> <span class="opt" data-i18n="f_targets_opt"></span></label>
    <div class="chips" id="targets"></div>

    <label class="f" for="gpa"><span data-i18n="f_gpa"></span> <span class="opt" data-i18n="f_gpa_opt"></span></label>
    <input id="gpa" type="number" step="0.01" min="0" max="5" data-i18n-ph="ph_gpa" autocomplete="off" inputmode="decimal">

    <label class="f"><span data-i18n="f_find_course"></span> <span class="opt" data-i18n="f_find_course_opt"></span></label>
    <div class="sugg-wrap">
      <input id="courseSearch" data-i18n-ph="ph_find_course" autocomplete="off"
        oninput="cmp_courseSearch()" onfocus="cmp_courseSearch()" onkeydown="cmp_courseSearchKey(event)" onblur="cmp_courseSearchHide()">
      <div class="sugg" id="courseSugg" hidden></div>
    </div>

    <label class="f" for="courses"><span data-i18n="f_courses"></span> <span class="opt" data-i18n="f_courses_opt"></span></label>
    <textarea id="courses" data-i18n-ph="ph_courses" oninput="cmp_countCourses()"></textarea>
    <div class="hint" id="courseCount"></div>

    <div class="btn-row">
      <button class="btn ghost" id="backStep1" onclick="cmp_toStep1()" data-i18n="btn_back"></button>
      <button class="btn" id="go" onclick="cmp_run()" data-i18n="btn_compare"></button>
    </div>
  </div>

  <div class="card" id="plans">
    <div class="step-tag"><span data-i18n="plans_title"></span></div>
    <div class="plan-row">
      <input id="planName" data-i18n-ph="ph_plan_name" maxlength="30" autocomplete="off">
      <button class="btn ghost sm" onclick="cmp_savePlan()" data-i18n="btn_save_plan"></button>
    </div>
    <div id="planList"></div>
  </div>
  <div id="planDiff"></div>

  <div id="result"></div>

  <details class="card scope">
    <summary data-i18n="scope_title"></summary>
    <div class="hint" data-i18n="scope_body"></div>
  </details>

  <div class="disclaimer" data-i18n="disclaimer_compare"></div>
</div>

<nav class="tabbar">
  <a href="index.html"><span class="ico">🏠</span><span data-i18n="nav_home"></span></a>
  <a href="tag.html"><span class="ico">🎓</span><span data-i18n="nav_tag"></span></a>
  <a href="compare.html" class="active"><span class="ico">🔀</span><span data-i18n="nav_compare"></span></a>
  <a href="validate.html"><span class="ico">📋</span><span data-i18n="nav_validate"></span></a>
</nav>

<script src="js/artic-gz-1.js?v=25"></script>
<script src="js/artic-gz-2.js?v=25"></script>
<script src="js/artic-gz-3.js?v=25"></script>
<script src="js/artic-gz-4.js?v=25"></script>
<script src="js/artic-boot.js?v=25"></script>
<script src="js/admit-gz-1.js?v=25"></script>
<script src="js/admit-boot.js?v=25"></script>
<script src="js/tagchance-data.js?v=25"></script>
<script src="js/i18n.js?v=25"></script>
<script src="js/comparator.js?v=25"></script>
<script src="js/admit.js?v=25"></script>
<script src="js/app-compare.js?v=25"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
