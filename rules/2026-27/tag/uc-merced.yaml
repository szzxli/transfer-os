school: UC Merced
program: TAG
academic_year: 2026-27
admission_cycle: Fall 2027
source: https://admissions.ucmerced.edu/transfer/tag
verified_date: 2026-10-23
requirements:
  min_gpa:
    school_of_engineering: 3.0
    school_of_natural_sciences: 2.9
    school_of_social_sciences_humanities_and_arts: 2.8
    psychology: 3.0
    public_health: 3.0
    note: minimum GPA by end of summer 2026, in all UC-transferable coursework.
  igetc_calgetc: required for Public Health majors only
  min_units_at_tag_submission: 30 semester UC-transferable units at the time of TAG application (end of summer 2026)
  min_units_at_transfer: 60 semester (90 quarter) UC-transferable units by end of spring 2027
  english:
    - first English composition course by end of fall 2026
    - second English (critical thinking) course by end of spring 2027
  math:
    - one math/quantitative reasoning course by end of fall 2026
  grade_rules:
    - no unrepeated grades of No Pass, C-, D, or F in UC-transferable coursework
    - no more than two total withdrawals in major preparation courses (including emergency/excused withdrawals)
    - no more than one major preparation course with a grade of No Pass, D, or F, even if repeated with passing grades
  max_total_units: must not exceed 80 semester total UC-transferable units after applying lower-division limits (students with only CCC coursework plus AP/IB/A-level will not exceed this)
  max_spring_units: last term must have no more than 19 UC-transferable semester units
  enrollment_rules:
    - full-time enrollment during fall 2026 (if part-time, explanation required in TAG application)
    - last college attended in a regular session (fall 2026 or winter/spring 2027) must be a CCC
  not_eligible:
    - students who have baccalaureate degrees
    - students attending high school in fall 2026, even if simultaneously enrolled at a CCC
    - former UC students who left UC not in good academic standing
    - former UC Merced students, except those enrolled only in summer sessions
  major_preparation: complete the academic criteria for the major by end of spring term with grade C or better; see school-specific preparation pages
  tag_window: September 1-30
  uc_application_deadline: November 30
  spring_tag: UC Merced also offers a spring TAG option
  adt_guarantee:
    announced: 2026-10-20
    source: https://news.ucmerced.edu/news/2026/transferring-community-college-uc-merced-just-got-easier
    requirements_source: https://admissions.ucmerced.edu/transfer/requirements
    summary: UC Merced joined the Associate Degree for Transfer (ADT) program (announced with the CCC Chancellor's Office). Students applying to UC Merced for fall 2027 who complete an approved ADT by summer 2027 can transfer into the corresponding major with guaranteed admission and junior standing, and earn the bachelor's degree with no more than 60 additional semester units at UC Merced, provided all program conditions are met. Includes a $4,000 annual scholarship for up to two consecutive academic years while maintaining good standing and eligibility.
    requirements:
      - Complete an approved ADT in the same major applied to at UC Merced
      - Meet UC Merced's junior-level transfer GPA requirement
      - Indicate on the UC application that they plan to complete an ADT
      - Complete the ADT before enrolling at UC Merced
    initial_pathways:
      - Anthropology AA-T to Anthropology, B.A.
      - Biology AS-T to Biological Sciences, B.A. (incl. Education emphasis)
      - Biology AS-T to Biological Sciences, B.S. (Developmental Biology, Education, General Biology, Human Biology, Microbiology and Immunology, Molecular and Cell Biology emphases)
      - Elementary Teacher Education AA-T to Liberal Studies, B.A.
      - History AA-T to History, B.A. (incl. Teaching Social Science emphasis)
      - Social Justice Studies AA-T to Critical Race and Ethnic Studies, B.A. (incl. Teaching Social Science emphasis)
      - Political Science AA-T to Political Science, B.A. (American Politics, Comparative Politics, International Relations, Law and Policy emphases)
    more_pathways: Additional pathways expected; check the official admissions page for the current list.
  tag_major_must_match_uc_app_major: unknown
  notes:
    - Among the six TAG campuses, Merced has the lowest GPA thresholds and the only spring TAG option.
    - UC Merced joined the ADT program (announced 2026-10-20): approved ADT holders get guaranteed admission with junior standing + $4,000/yr scholarship (up to 2 years) for fall 2027 entry; see adt_guarantee.
